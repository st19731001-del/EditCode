<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EditCode - Online Editor</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="app.js" defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #1e1e1e; color: #fff; overflow: hidden; }
    .hidden { display: none !important; }

    /* 表画面 (VS Code風エディタ) */
    #editor-screen { display: flex; flex-direction: column; height: 100vh; background: #1e1e1e; }
    .editor-header { height: 45px; background: #252526; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border-bottom: 1px solid #333; }
    .editor-title { font-size: 13px; color: #cccccc; display: flex; align-items: center; gap: 8px; }
    .js-icon { background: #f7df1e; color: #000; font-weight: bold; font-size: 11px; padding: 2px 4px; border-radius: 2px; cursor: pointer; user-select: none; }
    .btn-commit { background: #0e639c; color: #fff; border: none; padding: 6px 12px; border-radius: 3px; font-size: 12px; cursor: pointer; }
    .btn-commit:active { background: #1177bb; }
    #code-area { flex: 1; width: 100%; background: #1e1e1e; color: #d4d4d4; border: none; padding: 12px; font-family: "Courier New", Courier, monospace; font-size: 13px; resize: none; outline: none; }

    /* 裏画面 (暗号化チャット) */
    #secret-screen { display: flex; flex-direction: column; height: 100vh; background: #121212; position: relative; }
    .chat-header { height: 50px; background: #1f1f1f; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border-bottom: 1px solid #2d2d2d; z-index: 10; }
    .header-left { display: flex; align-items: center; gap: 8px; }
    .btn-icon { background: transparent; border: none; color: #fff; font-size: 18px; cursor: pointer; padding: 4px; }
    
    /* 接続状態表示（色覚に配慮したUI） */
    #role-display { font-size: 12px; transition: all 0.2s ease; }

    .chat-body { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .hidden-messages { display: none !important; }

    .system-msg { text-align: center; font-size: 11px; color: #888; margin: 6px 0; }
    .msg { max-width: 80%; display: flex; flex-direction: column; position: relative; word-break: break-word; transition: transform 0.2s ease; }
    .my-msg { align-self: flex-end; background: #007aff; color: #fff; padding: 8px 12px; border-radius: 16px 16px 2px 16px; }
    .partner-msg { align-self: flex-start; background: #2c2c2e; color: #fff; padding: 8px 12px; border-radius: 16px 16px 16px 2px; }
    .stamp-msg { background: transparent !important; font-size: 38px; padding: 0 !important; }
    
    .msg-meta { display: flex; align-items: center; justify-content: flex-end; gap: 4px; font-size: 10px; color: rgba(255,255,255,0.6); margin-top: 4px; }
    .reply-quote { background: rgba(0,0,0,0.2); border-left: 2px solid #fff; padding: 4px 6px; font-size: 11px; margin-bottom: 4px; border-radius: 2px; }

    /* 入力エリア */
    .chat-input-container { background: #1f1f1f; border-top: 1px solid #2d2d2d; padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; }
    .hidden-input { display: none !important; }
    .input-row { display: flex; align-items: center; gap: 8px; }
    
    #chat-input { flex: 1; background: #2c2c2e; color: #fff; border: 1px solid #3a3a3c; border-radius: 18px; padding: 8px 12px; font-size: 14px; outline: none; max-height: 120px; resize: none; }
    .btn-send { background: #007aff; color: #fff; border: none; padding: 8px 16px; border-radius: 18px; font-weight: bold; font-size: 13px; cursor: pointer; }
    
    /* 返信プレビュー */
    #reply-preview { display: flex; align-items: center; justify-content: space-between; background: #2c2c2e; padding: 4px 10px; border-radius: 4px; font-size: 12px; color: #aaa; }

    /* スタンプパレット */
    #stamp-palette { display: flex; flex-wrap: wrap; gap: 10px; padding: 10px; background: #1f1f1f; border-top: 1px solid #2d2d2d; max-height: 150px; overflow-y: auto; }
    .stamp-item { font-size: 26px; cursor: pointer; user-select: none; }

    /* アクションシート */
    .action-sheet-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 4000; display: flex; align-items: flex-end; }
    .action-sheet-content { width: 100%; background: #1f1f1f; border-radius: 12px 12px 0 0; padding: 8px 0; }
    .action-btn { width: 100%; background: transparent; border: none; color: #007aff; padding: 14px; font-size: 16px; border-bottom: 1px solid #2d2d2d; text-align: center; cursor: pointer; }
    .action-btn.danger { color: #ff3b30; }

    /* ダミートースト */
    #dummy-toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #28a745; color: #fff; padding: 8px 16px; border-radius: 4px; font-size: 12px; z-index: 5000; }
  </style>
</head>
<body>

  <!-- 表画面: VS Code風エディタ -->
  <div id="editor-screen">
    <div class="editor-header">
      <div class="editor-title">
        <span id="js-icon-trigger" class="js-icon">JS</span>
        <span>app.js - EditCode</span>
      </div>
      <button class="btn-commit" onclick="showDummyCommitToast()">Commit Changes</button>
    </div>
    <textarea id="code-area" spellcheck="false">// Auto-generated maintenance script
function checkSystemStatus() {
  const status = "OPERATIONAL";
  console.log(`[SYSTEM]: Status is currently ${status}`);
  return true;
}
checkSystemStatus();</textarea>
  </div>

  <!-- 裏画面: 暗号化チャット -->
  <div id="secret-screen" class="hidden">
    <div class="chat-header">
      <div class="header-left">
        <button class="btn-icon" onclick="hideToEditor()">🚪</button>
        <span id="role-display">Me: user_a | 📴 OFFLINE［非同期DBモード］</span>
      </div>
      <div>
        <button class="btn-icon" onclick="startCall()">📞</button>
        <button class="btn-icon btn-show" onclick="toggleMessageVisibility()">👁️</button>
      </div>
    </div>

    <!-- メッセージ一覧 -->
    <div id="message-list" class="chat-body hidden-messages">
      <div class="system-msg">暗号化されたP2P通信が有効です</div>
    </div>

    <!-- スタンプパレット -->
    <div id="stamp-palette" class="hidden">
      <span class="stamp-item" onclick="sendStamp('😊')">😊</span>
      <span class="stamp-item" onclick="sendStamp('😂')">😂</span>
      <span class="stamp-item" onclick="sendStamp('😍')">😍</span>
      <span class="stamp-item" onclick="sendStamp('👍')">👍</span>
      <span class="stamp-item" onclick="sendStamp('🙏')">🙏</span>
      <span class="stamp-item" onclick="sendStamp('😭')">😭</span>
      <span class="stamp-item" onclick="sendStamp('😎')">😎</span>
      <span class="stamp-item" onclick="sendStamp('🎉')">🎉</span>
      <span class="stamp-item" onclick="sendStamp('❤️')">❤️</span>
      <span class="stamp-item" onclick="sendStamp('🔥')">🔥</span>
    </div>

    <!-- 入力エリア -->
    <div id="chat-input-area" class="chat-input-container hidden-input">
      <div id="reply-preview" class="hidden">
        <span id="reply-text">返信先テキスト</span>
        <button onclick="cancelReply()" style="background:none;border:none;color:#aaa;cursor:pointer;">✕</button>
      </div>
      <div class="input-row">
        <button class="btn-icon" onclick="toggleStampPalette()">😊</button>
        
        <!-- ファイル・画像添付ボタン -->
        <label for="file-input" style="cursor:pointer;font-size:20px;padding:0 4px;">📎</label>
        <input type="file" id="file-input" style="display:none;" onchange="handleFileSelect(event)">

        <textarea id="chat-input" rows="1" placeholder="メッセージを入力..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-form-type="other"></textarea>
        <button class="btn-send" onclick="sendMsg()">送信</button>
      </div>
    </div>
  </div>

  <!-- アクションシート -->
  <div id="action-sheet" class="action-sheet-overlay hidden" onclick="closeActionSheet()">
    <div class="action-sheet-content" onclick="event.stopPropagation()">
      <button class="action-btn" onclick="handleMenuCopy()">テキストをコピー</button>
      <button class="action-btn" onclick="handleMenuReply()">返信</button>
      <button class="action-btn" onclick="handleMenuSelectDelete()">選択して削除</button>
      <button class="action-btn danger" onclick="handleMenuDelete()">削除</button>
      <button class="action-btn" onclick="closeActionSheet()" style="color:#888;">キャンセル</button>
    </div>
  </div>

  <!-- トースト通知 -->
  <div id="dummy-toast" class="hidden"></div>

</body>
</html>
