    <!-- 入力エリア（Gboard学習抑止・シークレット入力属性適用） -->
    <div id="chat-input-area" class="chat-input-container hidden-input">
      <div id="reply-preview" class="hidden">
        <span id="reply-text">返信先テキスト</span>
        <button onclick="cancelReply()" style="background:none;border:none;color:#aaa;cursor:pointer;">✕</button>
      </div>
      <div class="input-row">
        <button class="btn-icon" onclick="toggleStampPalette()">😊</button>
        
        <!-- ファイル・画像添付ボタン -->
        <label for="file-input" style="cursor:pointer;font-size:20px;padding:0 4px;">📎</label>
        <input type="file" id="file-input" style="display:none;" onchange="handleFileSelect(event)">

        <!--
          修正(原因5): <textarea>にtype="password"を指定してもHTML仕様上は無効な属性で
          何の効果もない。Android/GboardのIMEは<input type="password">に対してのみ
          「パスワード用テキスト」と判定して学習を止める仕組みになっており、
          <textarea>（複数行入力）にはこの仕組みそのものが適用されない。
          そのため、無効な属性は削除し、ブラウザが実際に解釈できる抑止系属性のみを残す。
          ※ただし複数行(改行)入力を維持する以上、GboardのIME学習を100%止める
          標準的なWeb APIは現状存在せず、これは「ベストエフォート」止まりであることに留意。
        -->
        <textarea 
          id="chat-input" 
          rows="1" 
          placeholder="メッセージを入力..." 
          autocomplete="off"
          autocorrect="off" 
          autocapitalize="none" 
          spellcheck="false" 
          inputmode="text" 
          data-form-type="other" 
          data-lpignore="true"
          data-1p-ignore="true"
        ></textarea>
        <button class="btn-send" onclick="sendMsg()">送信</button>
      </div>
    </div>

  <!-- アクションシート -->
  <div id="action-sheet" class="action-sheet-overlay hidden" onclick="closeActionSheet()">
    <div class="action-sheet-content" onclick="event.stopPropagation()">
      <button class="action-btn" onclick="handleMenuCopy()">テキストをコピー</button>
      <button class="action-btn" onclick="handleMenuReply()">返信</button>
      <button class="action-btn" onclick="handleMenuSelectDelete()">選択して削除</button>
      <button class="action-btn danger" onclick="handleMenuDelete()">削除</button>
      <button class="action-btn" onclick="closeActionSheet()" style="color:#888;">キャンセル</button>
    </div>
  </div>

  <div id="selection-toolbar" class="selection-toolbar hidden">
    <span id="selection-count">0件選択中</span>
    <button class="action-btn danger" onclick="deleteSelectedMessages()">選択したメッセージを削除</button>
    <button class="action-btn" onclick="cancelSelectMode()">キャンセル</button>
  </div>
