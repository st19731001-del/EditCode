<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EditCode</title>
  <link rel="stylesheet" href="./style.css">
  <!-- WebRTCライブラリ (PeerJS) -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <!-- ================= 1. 表の姿：ダミーコードエディタ ================= -->
  <div id="editor-screen" class="screen">
    <header class="top-bar">
      <div class="file-info">
        <span class="file-icon">JS</span>
        <span class="file-name">analytics_core.js</span>
      </div>
      <!-- 隠し切替ボタン -->
      <button class="btn-commit" onclick="switchToSecret()">Commit Changes</button>
    </header>

    <div class="editor-container">
      <div class="line-numbers">
        1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9<br>10<br>11<br>12<br>13<br>14<br>15
      </div>
      <textarea class="code-area" spellcheck="false">// System Core Analytics Module v2.4.1
import { initializeApp } from 'firebase/app';
import { getAnalytics, logEvent } from 'firebase/analytics';

const firebaseConfig = {
  apiKey: "AIzaSyD-xX8910_sample_key_99812",
  authDomain: "core-analytics-prod.firebaseapp.com",
  projectId: "core-analytics-prod",
  storageBucket: "core-analytics-prod.appspot.com"
};

const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);

export function trackUserSession(sessionId) {
  logEvent(analytics, 'session_start', { id: sessionId });
}</textarea>
    </div>
  </div>

  <!-- ================= 2. 裏の姿：隠しメッセージ＆通話画面 ================= -->
  <div id="secret-screen" class="screen hidden">
    <header class="top-bar secret-bar">
      <div class="partner-status">
        <span class="status-dot"></span>
        <span class="partner-name">Partner (Offline)</span>
      </div>
      <button class="btn-call" onclick="startCall()">📞 通話</button>
      <button class="btn-hide" onclick="hideToEditor()">🔒 隠す</button>
    </header>

    <div class="chat-container">
      <div class="message-list" id="message-list">
        <div class="system-msg">暗号化されたP2P通信が有効です</div>
      </div>
      <div class="chat-input-area">
        <input type="text" id="chat-input" placeholder="メッセージを入力...">
        <button onclick="sendMsg()">送信</button>
      </div>
    </div>
  </div>

  <!-- JavaScriptロジックの読み込み -->
  <script src="./app.js"></script>
</body>
</html>
