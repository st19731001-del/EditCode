<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EditCode</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ================= 1. 表の姿：ダミーコードエディタ ================= -->
  <div id="editor-screen" class="screen">
    <header class="top-bar">
      <div class="file-info">
        <span class="file-icon">JS</span>
        <span class="file-name">analytics_core.js</span>
      </div>
      <!-- 隠し切替ボタン（一般人にはコード提出ボタンに見える） -->
      <button class="btn-commit" onclick="switchToSecret()">Commit Changes</button>
    </header>

    <div class="editor-container">
      <div class="line-numbers">
        1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9<br>10<br>11<br>12<br>13<br>14<br>15
      </div>
      <textarea class="code-area" spellcheck="false">// System Core Analytics Module v2.4.1
import { initializeApp } from 'firebase/app';
import { getAnalytics, logEvent } from 'firebase/analytics';

const firebaseConfig = {
  apiKey: "AIzaSyD-xX8910_sample_key_99812",
  authDomain: "core-analytics-prod.firebaseapp.com",
  projectId: "core-analytics-prod",
  storageBucket: "core-analytics-prod.appspot.com"
};

const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);

export function trackUserSession(sessionId) {
  logEvent(analytics, 'session_start', { id: sessionId });
}</textarea>
    </div>
  </div>

  <!-- ================= 2. 裏の姿：隠しメッセージ＆通話画面 ================= -->
  <div id="secret-screen" class="screen hidden">
    <header class="top-bar secret-bar">
      <div class="partner-status">
        <span class="status-dot"></span>
        <span class="partner-name">Partner</span>
      </div>
      <button class="btn-call" onclick="alert('ステップ2で通話機能を実装します')">📞 通話</button>
      <button class="btn-hide" onclick="hideToEditor()">🔒 隠す</button>
    </header>

    <div class="chat-container">
      <div class="message-list" id="message-list">
        <div class="system-msg">暗号化されたチャットが開始されました</div>
      </div>
      <div class="chat-input-area">
        <input type="text" id="chat-input" placeholder="メッセージを入力...">
        <button onclick="sendDummyMsg()">送信</button>
      </div>
    </div>
  </div>

  <script>
    // 画面切り替え：エディタ ➔ 隠しチャット
    function switchToSecret() {
      document.getElementById('editor-screen').classList.add('hidden');
      document.getElementById('secret-screen').classList.remove('hidden');
    }

    // 緊急回避：隠しチャット ➔ エディタ
    function hideToEditor() {
      document.getElementById('secret-screen').classList.add('hidden');
      document.getElementById('editor-screen').classList.remove('hidden');
    }

    // 傾きセンサー（スマホを伏せる / 急に傾けると緊急回避）
    if (window.DeviceOrientationEvent) {
      window.addEventListener('deviceorientation', function(event) {
        // beta: スマホの前後傾き（-180〜180）
        // スマホを完全に伏せた時（betaが-170以下または170以上）に緊急退避
        if (event.beta < -150 || event.beta > 150) {
          hideToEditor();
        }
      });
    }

    // 簡易動作テスト用（送信処理）
    function sendDummyMsg() {
      const input = document.getElementById('chat-input');
      if (!input.value.trim()) return;
      
      const list = document.getElementById('message-list');
      const msg = document.createElement('div');
      msg.className = 'msg my-msg';
      msg.innerText = input.value;
      list.appendChild(msg);
      input.value = '';
      list.scrollTop = list.scrollHeight;
    }
  </script>
</body>
</html>
