<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EditCode</title>
  
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.png" type="image/png">
  <link rel="apple-touch-icon" href="./icon.png">
  <meta name="theme-color" content="#252526">

  <link rel="stylesheet" href="./style.css">
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <!-- ================= 1. 表の姿：ダミーコードエディタ ================= -->
  <div id="editor-screen" class="screen">
    <header class="top-bar">
      <div class="file-info">
        <span class="file-icon">JS</span>
        <span class="file-name">analytics_core.js</span>
      </div>
      <button class="btn-commit" onclick="switchToSecret()">Commit Changes</button>
    </header>

    <div class="editor-container">
      <div class="line-numbers">
        1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9<br>10<br>11<br>12<br>13<br>14<br>15
      </div>
      <textarea class="code-area" spellcheck="false">// System Core Analytics Module v2.4.1
import { initializeApp } from 'firebase/app';
import { getAnalytics, logEvent } from 'firebase/analytics';

const firebaseConfig = {
  apiKey: "AIzaSyD-xX8910_sample_key_99812",
  authDomain: "core-analytics-prod.firebaseapp.com",
  projectId: "core-analytics-prod",
  storageBucket: "core-analytics-prod.appspot.com"
};

const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);

export function trackUserSession(sessionId) {
  logEvent(analytics, 'session_start', { id: sessionId });
}</textarea>
    </div>
  </div>

  <!-- ================= 2. 裏の姿：隠しメッセージ＆通話画面 ================= -->
  <div id="secret-screen" class="screen hidden">
    <header class="top-bar secret-bar">
      <div class="partner-status">
        <span class="status-dot"></span>
        <span class="partner-name">Partner (Offline)</span>
      </div>
      <div class="header-btns">
        <button class="btn-call" onclick="startCall()">📞 通話</button>
        <button class="btn-show" onclick="toggleMessageVisibility()">👁️ 表示</button>
        <button class="btn-hide" onclick="hideToEditor()">🔒 隠す</button>
      </div>
    </header>

    <div class="chat-container">
      <!-- メッセージリスト（初期状態は非表示） -->
      <div class="message-list hidden-messages" id="message-list">
        <div class="system-msg">暗号化されたP2P通信が有効です</div>
      </div>

      <!-- スタンプ選択パレット -->
      <div id="stamp-palette" class="stamp-palette hidden">
        <div class="stamp-grid">
          <span onclick="sendStamp('👍')">👍</span>
          <span onclick="sendStamp('❤️')">❤️</span>
          <span onclick="sendStamp('😂')">😂</span>
          <span onclick="sendStamp('😭')">😭</span>
          <span onclick="sendStamp('🎉')">🎉</span>
          <span onclick="sendStamp('🔥')">🔥</span>
          <span onclick="sendStamp('🙏')">🙏</span>
          <span onclick="sendStamp('✨')">✨</span>
          <span onclick="sendStamp('👌')">👌</span>
          <span onclick="sendStamp('🥺')">🥺</span>
          <span onclick="sendStamp('😎')">😎</span>
          <span onclick="sendStamp('😴')">😴</span>
        </div>
      </div>

      <!-- リプライプレビュー -->
      <div id="reply-preview" class="reply-preview hidden">
        <div class="reply-content">
          <span class="reply-title">返信先:</span>
          <span id="reply-text" class="reply-text"></span>
        </div>
        <button class="btn-cancel-reply" onclick="cancelReply()">✕</button>
      </div>

      <!-- メッセージ入力エリア -->
      <div class="chat-input-area">
        <button class="btn-stamp" onclick="toggleStampPalette()">😊</button>
        <input 
          type="text" 
          id="chat-input" 
          placeholder="メッセージを入力..."
          autocomplete="off" 
          autocorrect="off" 
          autocapitalize="off" 
          spellcheck="false"
          data-form-type="other"
        >
        <button onclick="sendMsg()">送信</button>
      </div>
    </div>
  </div>

  <!-- タップ操作メニューシート（長押し時に発動） -->
  <div id="action-sheet" class="action-sheet-backdrop hidden" onclick="closeActionSheet()">
    <div class="action-sheet-menu" onclick="event.stopPropagation()">
      <button class="as-btn" onclick="handleMenuCopy()">📋 コピー</button>
      <button class="as-btn" onclick="handleMenuReply()">💬 リプライ（返信）</button>
      <button class="as-btn as-danger" onclick="handleMenuDelete()">🗑️ 削除</button>
      <button class="as-btn as-cancel" onclick="closeActionSheet()">キャンセル</button>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
